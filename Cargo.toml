[workspace]
resolver = "3"
members = ["crates/wdu-core", "crates/wdu-cli", "crates/wdu-service", "crates/wdu-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
wdu-core = { path = "crates/wdu-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
cab = "0.6"
reqwest = { version = "0.13", features = ["blocking"] }
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
wmi = "0.18"
windows = "0.62"
windows-core = "0.62"
windows-service = "0.8"
gpui-kit = "0.8.1"
embed-resource = "3"
